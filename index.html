function openForm(type,id){
 mode='form';const o=id?get(id):{},m=$('#m');
 m.innerHTML=`<h3>${id?'Sửa':'Thêm'} ${TT[type].toLowerCase()} – ${vn(o.date||day)}</h3>`+F[type].map(([k,l,t])=>{
  const v=o[k]??(k==='fdate'?day:'');let f;
  if(t==='ta')f=`<textarea id="f_${k}">${esc(v)}</textarea>`;
  else if(t==='cb')f=`<input type="checkbox" id="f_${k}" ${v?'checked':''} style="width:auto">`;
  else if(t==='sel')f=`<select id="f_${k}">${ST.map(s=>`<option ${s===(v||ST[0])?'selected':''}>${s}</option>`).join('')}</select>`;
  else if(t==='cat')f=`<select id="f_${k}">${CAT.map(s=>`<option ${s===(v||CAT[0])?'selected':''}>${s}</option>`).join('')}</select>`;
  else if(t==='mem')f=`<select id="f_${k}"><option value="">— Chưa phân công —</option>${Object.keys(members).map(u=>`<option value="${u}" ${u===v?'selected':''}>${esc(nm(u))}</option>`).join('')}</select>`;
  else f=`<input id="f_${k}" type="${t||'text'}" value="${esc(v)}">`;
  return`<label>${l}</label>${f}`}).join('')+`<div class="row" style="margin-top:12px;justify-content:flex-end"><button onclick="$('#m').close()">Hủy</button><button class="pr" onclick="save('${type}','${id||''}')">Lưu</button></div>`;
 m.onclose=()=>mode='';m.showModal();
}
async function save(type,id){
 const v={};F[type].forEach(([k,,t])=>{const e=$('#f_'+k);v[k]=t==='cb'?e.checked:e.value.trim()});
 if(!v[F[type][0][0]]&&!(type==='checkin'&&v.flt)){alert('Vui lòng nhập nội dung.');return}
 const o=id?get(id):{},nid=id||'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 const{id:_x,...old}=o;
 try{await db.collection('items').doc(nid).set({...old,...v,type,date:old.date||day,by:old.by||meId,at:old.at||Date.now(),ack:old.ack||{}});$('#m').close()}catch(e){alert('Không lưu được: '+(e.message||e.code))}
}
function openUsers(){mode='users';const m=$('#m');m.onclose=()=>mode='';usersView();if(!m.open)m.showModal()}
const roleOpts=sel=>[['member','Thành viên'],...(isAdm()||sel==='admin'?[['admin','Admin']]:[]),...Object.entries(roles).map(([k,v])=>[k,v.name])].map(([k,n])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(n)}</option>`).join('');
function usersView(){
 mode='users';const ids=Object.keys(members),cu=can('users'),pend=Object.entries(requests).filter(([id])=>!members[id]);
 $('#m').innerHTML=`<div class="top" style="margin:0"><h3>Người dùng (${ids.length})</h3>${can('roles')?'<button onclick="rolesView()">⚙ Quản lý role</button>':''}</div>`
 +(cu&&pend.length?`<label style="color:var(--er)">Yêu cầu chờ duyệt (${pend.length})</label>`+pend.map(([id,q])=>`<div class="row" style="justify-content:space-between;margin:4px 0"><span>${esc(q.name||'Người dùng mới')}</span><span class="row"><select id="rq_${id}" style="width:auto">${roleOpts('member')}</select><button class="pr" onclick="approve('${id}')">Duyệt</button><button class="dg" onclick="rejectReq('${id}')">Từ chối</button></span></div>`).join(''):'')
 +'<label>Danh sách hiện tại</label>'+ids.map(u=>{const ro=members[u].role,lock=!cu||u===meId||(ro==='admin'&&!isAdm());
  return`<div class="row" style="justify-content:space-between;margin:4px 0"><span>${esc(nm(u))}${u===meId?' (bạn)':''}</span><span class="row"><select onchange="setRole('${u}',this.value)" ${lock?'disabled':''}>${roleOpts(ro)}</select>${lock?'':`<button class="dg" onclick="rmUser('${u}')">Xóa</button>`}</span></div>`}).join('')
 +(cu?`<div class="mu" style="margin-top:10px">Thêm người mới: nhân viên mở trang, bấm “Tạo tài khoản” (email + mật khẩu), sau đó bấm “Gửi yêu cầu truy cập”. Yêu cầu sẽ hiện ở mục chờ duyệt phía trên để bạn chọn role và duyệt.</div>`:'')
 +`<div class="row" style="margin-top:12px;justify-content:flex-end"><button onclick="$('#m').close()">Đóng</button></div>`;
}
let tm;function srch(q){clearTimeout(tm);tm=setTimeout(async()=>{const box=$('#res');if(!box)return;
 try{const r=(await user.search(q)).filter(p=>!members[p.id]&&!p.isMe);r.forEach(p=>names[p.id]=p.name);
 box.innerHTML=r.length?r.map(p=>`<div class="row" style="justify-content:space-between;margin:4px 0"><span>${esc(p.name)} <span class="mu">${esc(p.email||'')}</span></span><button class="pr" onclick="addUser('${p.id}')">Thêm</button></div>`).join(''):'<div class="mu">Không tìm thấy ai. Hãy dùng cách gửi link và duyệt yêu cầu ở trên.</div>'}
 catch(e){box.innerHTML='<div class="dg">Lỗi tìm kiếm: '+esc(e.message||e.code)+'</div>'}},250)}
async function addUser(id){if(!can('users'))return;try{await db.collection('members').doc(id).set({role:$('#nr')?.value||'member',name:names[id]||'',at:Date.now()})}catch(e){alert('Không thêm được: '+(e.message||e.code))}}
async function reqAccess(){try{const me=await user.me();await db.collection('requests').doc(meId).set({name:me.name||'',at:Date.now()})}catch(e){alert('Không gửi được yêu cầu: '+(e.message||e.code))}}
async function approve(id){if(!can('users'))return;try{await db.collection('members').doc(id).set({role:$('#rq_'+id)?.value||'member',name:requests[id]?.name||'',at:Date.now()});await db.collection('requests').doc(id).delete()}catch(e){alert('Không duyệt được: '+(e.message||e.code))}}
function rejectReq(id){if(can('users'))db.collection('requests').doc(id).delete()}
function setRole(id,r){if(!can('users'))return;if(members[id].role==='admin'&&r!=='admin'&&Object.values(members).filter(m=>m.role==='admin').length<2){alert('Cần có ít nhất 1 Admin.');usersView();return}db.collection('members').doc(id).update({role:r})}
function rmUser(id){if(!can('users')||(members[id].role==='admin'&&!isAdm()))return;if(confirm('Xóa người dùng này khỏi sổ?'))db.collection('members').doc(id).delete()}
function rolesView(){mode='roles';$('#m').innerHTML=`<h3>Quản lý role</h3><div class="mu">Mọi role đều xem được sổ và xác nhận triển khai. Admin (toàn quyền) và Thành viên (thêm/sửa mục, xuất Excel) là role mặc định, không sửa được.</div>`
 +Object.entries(roles).map(([k,v])=>`<div class="card" style="margin-top:8px"><b>${esc(v.name)}</b> <span class="mu">(${Object.values(members).filter(m=>m.role===k).length} người)</span><div class="mu">${PERMS.filter(p=>v.perms?.[p[0]]).map(p=>p[1]).join(' · ')||'Chỉ xem & xác nhận'}</div><div class="row" style="margin-top:6px"><button onclick="roleForm('${k}')">Sửa</button><button class="dg" onclick="delRole('${k}')">Xóa</button></div></div>`).join('')
 +`<div class="row" style="margin-top:10px;justify-content:space-between"><button class="pr" onclick="roleForm()">＋ Tạo role mới</button><button onclick="openUsers()">‹ Quay lại</button></div>`}
function roleForm(id){mode='roleform';const o=id?roles[id]:{};$('#m').innerHTML=`<h3>${id?'Sửa':'Tạo'} role</h3><label>Tên role (VD: Trưởng ca)</label><input id="rn" value="${esc(o.name||'')}"><label>Quyền hạn</label>`
 +PERMS.map(([k,l])=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="p_${k}" ${o.perms?.[k]?'checked':''} style="width:auto"> ${l}</label>`).join('')
 +`<div class="row" style="margin-top:12px;justify-content:flex-end"><button onclick="rolesView()">Hủy</button><button class="pr" onclick="saveRole('${id||''}')">Lưu</button></div>`}
async function saveRole(id){if(!can('roles'))return;const name=$('#rn').value.trim();if(!name){alert('Nhập tên role.');return}const perms={};PERMS.forEach(([k])=>perms[k]=$('#p_'+k).checked);
 await db.collection('roles').doc(id||'r'+Date.now().toString(36)).set({name,perms});rolesView()}
function delRole(id){if(!can('roles')||!confirm('Xóa role này? Người dùng thuộc role sẽ chuyển thành "Thành viên".'))return;Object.entries(members).forEach(([u,m])=>{if(m.role===id)db.collection('members').doc(u).update({role:'member'})});db.collection('roles').doc(id).delete()}
async function exportXls(){
 if(!can('export'))return;
 const dl=await claude.use('downloads');if(!dl){alert('Không hỗ trợ tải file ở chế độ này.');return}
 const mi=items.filter(i=>i.date?.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date)||a.at-b.at),wb=XLSX.utils.book_new(),ty=t=>mi.filter(i=>i.type===t);
 const add=(n,h,r)=>{const w=XLSX.utils.aoa_to_sheet([h,...r]);w['!cols']=h.map(()=>({wch:22}));XLSX.utils.book_append_sheet(wb,w,n)};
 add('Lưu ý',['Ngày','Phân loại','Quan trọng','Nội dung','Người ghi'],ty('note').map(i=>[vn(i.date),i.cat||CAT[0],i.imp?'Có':'',i.text,nm(i.by)]));
 add('Nhờ check-in',['Ngày','Người nhờ','Chuyến bay','PNR','Chặng bay','Ngày bay','Đối tượng khách','Yêu cầu hỗ trợ','Ghi chú','Tình trạng','Nhân sự thực hiện','Người ghi'],ty('checkin').map(i=>[vn(i.date),i.who,i.flt,i.pnr||'',i.route,vn(i.fdate),i.pax,i.req,i.note,i.st||ST[0],i.asg?nm(i.asg):'',nm(i.by)]));
 add('Triển khai',['Ngày','Nội dung','Chi tiết','Đã xác nhận','Chưa xác nhận'],ty('task').map(i=>{const a=i.ack||{},k=Object.keys(members);return[vn(i.date),i.title,i.body,k.filter(u=>a[u]).map(u=>nm(u)+' ('+hm(a[u])+')').join('; '),k.filter(u=>!a[u]).map(nm).join(', ')]}));
 try{await dl.save({filename:`SoGiaoCa_SPA_CXR_${month}.xlsx`,data:XLSX.write(wb,{bookType:'xlsx',type:'array'})})}catch(e){if(e.code!=='declined')alert('Không xuất được: '+(e.message||e.code))}
}
</script></body></html>

<script>
const SUPABASE_URL='PASTE_PROJECT_URL_HERE',SUPABASE_ANON_KEY='PASTE_ANON_KEY_HERE';

 if(/function.*(schema cache|does not exist)|could not find the function/i.test(m))return'Cơ sở dữ liệu chưa được nâng cấp. Hãy chạy lại toàn bộ schema.sql trong SQL Editor của Supabase.';
 if(/schema cache|does not exist|relation/i.test(m))return'Chưa tạo bảng dữ liệu. Hãy chạy file schema.sql trong SQL Editor của Supabase.';
 if(/row-level security|permission denied/i.test(m))return'Bạn không có quyền thực hiện thao tác này (nếu chắc chắn có quyền, hãy nhờ admin chạy lại schema.sql).';

 if(/invalid api key|apikey/i.test(m))return'Sai SUPABASE_ANON_KEY. Kiểm tra lại khóa anon/publishable trong index.html.';

 if(/at least 6|weak/i.test(m))return'Mật khẩu cần tối thiểu 6 ký tự.';

const chk=r=>{if(r.error)throw r.error;return r};
const claude={use:async n=>{
 if(!CFG)return null;
 if(n==='downloads')return{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
 const{data:{session}}=await sb.auth.getSession();if(!session)return null;const u=session.user,nameOf=()=>u.user_metadata?.name||u.email;

  isOwner:async()=>{const{count}=await sb.from('docs').select('*',{count:'exact',head:true}).eq('coll','members');return !count},
  profiles:async ids=>{const{data}=await sb.from('docs').select('id,data').in('id',ids).in('coll',['members','requests']);const o={};(data||[]).forEach(d=>{if(d.data.name)o[d.id]={name:d.data.name}});if(!o[u.id])o[u.id]={name:nameOf()};return o},
  search:async()=>[]};
 if(n==='db')return{collection:c=>({
  onSnapshot(cb,eb){const load=async()=>{const{data,error}=await sb.from('docs').select('id,data').eq('coll',c);if(error){eb&&eb(error);return}cb({docs:data.map(d=>({id:d.id,data:()=>d.data}))})};
   load();sb.channel('c_'+c+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'coll=eq.'+c},load).subscribe()},
  doc:id=>({set:async v=>chk(await sb.from('docs').upsert({coll:c,id,data:v})),

   delete:async()=>chk(await sb.from('docs').delete().eq('coll',c).eq('id',id))})})};
 return null}};
var signup=false;
function editMyName(){const p=prompt('Họ tên hiển thị của bạn:',nm(meId));if(p===null)return;sb.rpc('set_my_name',{n:p}).then(x=>x.error&&alert(viErr(x.error.message)))}
function renameUser(id){if(!can('users'))return;const p=prompt('Họ tên hiển thị:',nm(id));if(p===null||!p.trim())return;db.collection('members').doc(id).update({name:p.trim().slice(0,60)}).catch(e=>alert(viErr(e.message)))}

function showLogin(){$('#app').innerHTML=!window.supabase?'<div class="card"><h3>Không tải được thư viện Supabase</h3><p>Kiểm tra kết nối mạng hoặc tường lửa đang chặn cdn.jsdelivr.net.</p></div>':!CFG?'<div class="card"><h3>Chưa cấu hình Supabase</h3><p>Mở file index.html, điền <b>SUPABASE_URL</b> và <b>SUPABASE_ANON_KEY</b> ở đầu phần script.</p></div>':`<div class="card login">${BRAND}<label>Tên đăng nhập</label><input id="le" type="text" autocomplete="username" autocapitalize="none"><label>Mật khẩu</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()"><button class="pr" id="ab" onclick="doAuth()">Đăng nhập</button><div id="lm" class="dg" style="margin-top:8px"></div><div class="mu" style="margin-top:14px;font-size:12px;text-align:center">Kết nối: ${esc(URL_N.replace('https://',''))}</div></div>`}
function swAuth(){signup=!signup;$('#nmw').style.display=signup?'block':'none';$('#sw').textContent=signup?'Quay lại đăng nhập':'Tạo tài khoản';$('#ab').textContent=signup?'Đăng ký':'Đăng nhập'}
async function doAuth(){const e0=$('#le').value.trim().toLowerCase(),e=e0.includes('@')?e0:e0+'@sogiaoca.app',p=$('#lp').value,m=$('#lm');m.textContent='';

 if(x.error){m.innerHTML=esc(viErr(x.error.message))+'<div class="mu" style="font-size:12px">Chi tiết: '+esc(x.error.message)+'</div>';return}
 if(signup&&!x.data.session){m.textContent='Đã tạo tài khoản. Nếu không vào được, hãy kiểm tra email để xác nhận (hoặc tắt Confirm email trong Supabase), rồi đăng nhập.';return}
 location.reload()}catch(err){m.textContent=viErr(err.message)}}
const sv=p=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I={plus:sv('<path d="M12 5v14M5 12h14"/>'),edit:sv('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),trash:sv('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>'),

  return`<div class="row" style="justify-content:space-between;margin:4px 0"><span>${esc(nm(u))}${u===meId?' (bạn)':''}${cu?`<button class="lk" title="Sửa họ tên" onclick="renameUser('${u}')">${I.edit}</button>`:''}</span><span class="row"><select onchange="setRole('${u}',this.value)" ${lock?'disabled':''}>${roleOpts(ro)}</select>${lock?'':`<button class="dg" onclick="rmUser('${u}')">Xóa</button>`}</span></div>`}).join('')
 +(cu?`<div class="mu" style="margin-top:10px">Thêm người mới: tạo tài khoản trong Supabase → Authentication → Users → Add user (email <tên>@sogiaoca.app, chọn Auto Confirm). Người đó đăng nhập, bấm “Gửi yêu cầu truy cập”, yêu cầu sẽ hiện ở mục chờ duyệt phía trên. Bấm biểu tượng bút để sửa họ tên.</div>`:'')
 +`<div class="row" style="margin-top:12px;justify-content:flex-end"><button onclick="$('#m').close()">Đóng</button></div>`;
}
let tm;function srch(q){clearTimeout(tm);tm=setTimeout(async()=>{const box=$('#res');if(!box)return;
 try{const r=(await user.search(q)).filter(p=>!members[p.id]&&!p.isMe);r.forEach(p=>names[p.id]=p.name);
 box.innerHTML=r.length?r.map(p=>`<div class="row" style="justify-content:space-between;margin:4px 0"><span>${esc(p.name)} <span class="mu">${esc(p.email||'')}</span></span><button class="pr" onclick="addUser('${p.id}')">Thêm</button></div>`).join(''):'<div class="mu">Không tìm thấy ai. Hãy dùng cách gửi link và duyệt yêu cầu ở trên.</div>'}
 catch(e){box.innerHTML='<div class="dg">Lỗi tìm kiếm: '+esc(e.message||e.code)+'</div>'}},250)}
async function addUser(id){if(!can('users'))return;try{await db.collection('members').doc(id).set({role:$('#nr')?.value||'member',name:names[id]||'',at:Date.now()})}catch(e){alert('Không thêm được: '+(e.message||e.code))}}
async function reqAccess(){try{const me=await user.me();await db.collection('requests').doc(meId).set({name:me.name||'',at:Date.now()})}catch(e){alert('Không gửi được yêu cầu: '+(e.message||e.code))}}
async function approve(id){if(!can('users'))return;try{await db.collection('members').doc(id).set({role:$('#rq_'+id)?.value||'member',name:requests[id]?.name||'',at:Date.now()});await db.collection('requests').doc(id).delete()}catch(e){alert('Không duyệt được: '+(e.message||e.code))}}
function rejectReq(id){if(can('users'))db.collection('requests').doc(id).delete()}
function setRole(id,r){if(!can('users'))return;if(members[id].role==='admin'&&r!=='admin'&&Object.values(members).filter(m=>m.role==='admin').length<2){alert('Cần có ít nhất 1 Admin.');usersView();return}db.collection('members').doc(id).update({role:r})}
function rmUser(id){if(!can('users')||(members[id].role==='admin'&&!isAdm()))return;if(confirm('Xóa người dùng này khỏi sổ?'))db.collection('members').doc(id).delete()}
function rolesView(){mode='roles';$('#m').innerHTML=`<h3>Quản lý role</h3><div class="mu">Mọi role đều xem được sổ và xác nhận triển khai. Admin (toàn quyền) và Thành viên (thêm/sửa mục, xuất Excel) là role mặc định, không sửa được.</div>`
 +Object.entries(roles).map(([k,v])=>`<div class="card" style="margin-top:8px"><b>${esc(v.name)}</b> <span class="mu">(${Object.values(members).filter(m=>m.role===k).length} người)</span><div class="mu">${PERMS.filter(p=>v.perms?.[p[0]]).map(p=>p[1]).join(' · ')||'Chỉ xem & xác nhận'}</div><div class="row" style="margin-top:6px"><button onclick="roleForm('${k}')">Sửa</button><button class="dg" onclick="delRole('${k}')">Xóa</button></div></div>`).join('')
 +`<div class="row" style="margin-top:10px;justify-content:space-between"><button class="pr" onclick="roleForm()">＋ Tạo role mới</button><button onclick="openUsers()">‹ Quay lại</button></div>`}
function roleForm(id){mode='roleform';const o=id?roles[id]:{};$('#m').innerHTML=`<h3>${id?'Sửa':'Tạo'} role</h3><label>Tên role (VD: Trưởng ca)</label><input id="rn" value="${esc(o.name||'')}"><label>Quyền hạn</label>`
 +PERMS.map(([k,l])=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="p_${k}" ${o.perms?.[k]?'checked':''} style="width:auto"> ${l}</label>`).join('')
 +`<div class="row" style="margin-top:12px;justify-content:flex-end"><button onclick="rolesView()">Hủy</button><button class="pr" onclick="saveRole('${id||''}')">Lưu</button></div>`}
async function saveRole(id){if(!can('roles'))return;const name=$('#rn').value.trim();if(!name){alert('Nhập tên role.');return}const perms={};PERMS.forEach(([k])=>perms[k]=$('#p_'+k).checked);
 await db.collection('roles').doc(id||'r'+Date.now().toString(36)).set({name,perms});rolesView()}
function delRole(id){if(!can('roles')||!confirm('Xóa role này? Người dùng thuộc role sẽ chuyển thành "Thành viên".'))return;Object.entries(members).forEach(([u,m])=>{if(m.role===id)db.collection('members').doc(u).update({role:'member'})});db.collection('roles').doc(id).delete()}
async function exportXls(sc){
 if(!can('export'))return;
 const dl=await claude.use('downloads');if(!dl){alert('Không hỗ trợ tải file ở chế độ này.');return}
 const isD=sc==='day',mi=items.filter(i=>isD?i.date===day:i.date?.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date)||a.at-b.at),wb=XLSX.utils.book_new(),ty=t=>mi.filter(i=>i.type===t),mk=Object.keys(members);
 const add=(n,h,r,w)=>{const s=XLSX.utils.aoa_to_sheet([h,...r]);s['!cols']=h.map((_,k)=>({wch:w?.[k]||22}));XLSX.utils.book_append_sheet(wb,s,n)};
 const [Y,M]=month.split('-'),N=ty('note'),C=ty('checkin'),T=ty('task'),who=[...new Set([...mk,...mi.map(i=>i.by)])].filter(Boolean);
 add('Thống kê',[isD?'Ngày':'Tháng',isD?vn(day):`${M}/${Y}`,'',''],[[],['Loại','Số lượng'],['Lưu ý',N.length],['  trong đó Quan trọng',N.filter(i=>i.imp).length],['Nhờ check-in',C.length],['Triển khai',T.length],[],
  ['Lưu ý theo phân loại','Số lượng'],...CAT.map(c=>[c,N.filter(i=>(i.cat||CAT[0])===c).length]),[],
  ['Check-in theo tình trạng','Số lượng'],...ST.map(t=>[t,C.filter(i=>(i.st||ST[0])===t).length]),[],
  ['Người ghi','Lưu ý','Check-in','Triển khai'],...who.map(u=>[nm(u),N.filter(i=>i.by===u).length,C.filter(i=>i.by===u).length,T.filter(i=>i.by===u).length]),[],
  ['Xác nhận triển khai','Đã xác nhận','Tổng triển khai','Tỷ lệ'],...mk.map(u=>{const k=T.filter(i=>(i.ack||{})[u]).length;return[nm(u),k,T.length,T.length?Math.round(k*100/T.length)+'%':'']})],[30,14,16,10]);
 add('Lưu ý',['Ngày','Phân loại','Quan trọng','Nội dung','Người ghi'],N.map(i=>[vn(i.date),i.cat||CAT[0],i.imp?'Có':'',i.text,nm(i.by)]));
 add('Nhờ check-in',['Ngày','Người nhờ','Chuyến bay','PNR','Chặng bay','Ngày bay','Đối tượng khách','Yêu cầu hỗ trợ','Ghi chú','Tình trạng','Nhân sự thực hiện','Người ghi'],C.map(i=>[vn(i.date),i.who,i.flt,i.pnr||'',i.route,vn(i.fdate),i.pax,i.req,i.note,i.st||ST[0],i.asg?nm(i.asg):'',nm(i.by)]));
 add('Triển khai',['Ngày','Nội dung','Chi tiết','Đã xác nhận','Chưa xác nhận'],T.map(i=>{const a=i.ack||{};return[vn(i.date),i.title,i.body,mk.filter(u=>a[u]).map(u=>nm(u)+' ('+hm(a[u])+')').join('; '),mk.filter(u=>!a[u]).map(nm).join(', ')]}));
 try{await dl.save({filename:`SoGiaoCa_SPA_CXR_${isD?day:month}.xlsx`,data:XLSX.write(wb,{bookType:'xlsx',type:'array'})})}catch(e){if(e.code!=='declined')alert('Không xuất được: '+(e.message||e.code))}
}
</script></body></html>
